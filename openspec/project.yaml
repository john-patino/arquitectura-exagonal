# ==============================================================================
# OPENSPEC PROJECT SPECIFICATION: PRODUCT CATALOG & INVENTORY PLATFORM
# ==============================================================================
schema: "openspec/v1"
project:
  name: "ProductCatalogAndInventory"
  system: "Plataforma de Catálogo e Inventario de Productos"
  version: "1.0.0"
  deployment_classification: "Two-Tier Web Monolith"
  architectural_style: "Clean Architecture (Concentric Layers)"
  organization: "Universidad Popular del Cesar (Unicesar) - División de Arquitectura"

technology_stack:
  backend:
    framework: ".NET 8"
    language: "C# 12"
    runtime: "ASP.NET Core Web API"
    patterns:
      - "CQRS (Command Query Responsibility Segregation) con MediatR"
      - "Pipeline Validation Behaviors con FluentValidation"
      - "Repository & Unit of Work Patterns con EF Core"
      - "Rich Domain Model (Encapsulated Aggregate Roots)"
    dependencies:
      core:
        - "MediatR (>= 12.2.0)"
        - "FluentValidation (>= 11.9.0)"
        - "FluentValidation.DependencyInjectionExtensions (>= 11.9.0)"
      persistence:
        - "Microsoft.EntityFrameworkCore (>= 8.0.0)"
        - "Npgsql.EntityFrameworkCore.PostgreSQL (>= 8.0.0)"
      api:
        - "Swashbuckle.AspNetCore (>= 6.5.0)"
  frontend:
    framework: "React 18"
    bundler: "Vite 5"
    language: "TypeScript 5"
    styling: "Tailwind CSS 3"
    icons: "Lucide Icons (lucide-react)"
    state_and_fetch: "Fetch API / TanStack Query"
  database:
    engine: "PostgreSQL"
    version: "16"
    database_name: "product_catalog_db"
  infrastructure:
    orchestration: "Docker Compose v2"
    network: "clean-app-net"
    ports:
      frontend: 5173
      backend_api: 5000
      database: 5432
    volume: "clean_data"
  testing:
    framework: "xUnit (>= 2.6.0)"
    assertions: "FluentAssertions (>= 6.12.0)"
    mocking: "NSubstitute (>= 5.1.0)"
    containers: "Testcontainers.PostgreSql (>= 3.7.0)"

concentric_layers_taxonomy:
  - layer: "Domain"
    level: 0
    project: "ProductCatalog.Domain.csproj"
    classification: "Enterprise Business Rules (Core)"
    allowed_dependencies: []
    prohibited_dependencies:
      - "ProductCatalog.Application"
      - "ProductCatalog.Infrastructure"
      - "ProductCatalog.WebApi"
      - "Microsoft.EntityFrameworkCore"
      - "Microsoft.AspNetCore"
    responsibilities:
      - "Entidades ricas con estado encapsulado e invariantes de negocio"
      - "Value Objects inmutables"
      - "Excepciones tipadas de dominio"
      - "Interfaces de repositorios y contratos de dominio"

  - layer: "Application"
    level: 1
    project: "ProductCatalog.Application.csproj"
    classification: "Application Business Rules (Core)"
    allowed_dependencies:
      - "ProductCatalog.Domain"
    prohibited_dependencies:
      - "ProductCatalog.Infrastructure"
      - "ProductCatalog.WebApi"
      - "Microsoft.EntityFrameworkCore"
      - "Npgsql"
    responsibilities:
      - "Orquestación de casos de uso (Commands y Queries CQRS)"
      - "Definición de contratos de persistencia (IProductRepository, IUnitOfWork)"
      - "Validación de entrada sintáctica y semántica (FluentValidation)"
      - "DTOs inmutables de entrada y salida"
      - "Pipeline Behaviors de MediatR"

  - layer: "Infrastructure"
    level: 2
    project: "ProductCatalog.Infrastructure.csproj"
    classification: "Frameworks & Drivers (Persistence Details)"
    allowed_dependencies:
      - "ProductCatalog.Domain"
      - "ProductCatalog.Application"
    prohibited_dependencies:
      - "ProductCatalog.WebApi"
    responsibilities:
      - "Implementación de IProductRepository con EF Core y PostgreSQL"
      - "Implementación de IUnitOfWork y manejo transaccional"
      - "Contexto de base de datos CleanDbContext y mapeos de entidades relacionales"
      - "Migraciones y Seeding inicial de 10 productos"

  - layer: "WebApi"
    level: 2
    project: "ProductCatalog.WebApi.csproj"
    classification: "Interface Adapters & Composition Root (Host HTTP)"
    allowed_dependencies:
      - "ProductCatalog.Domain"
      - "ProductCatalog.Application"
      - "ProductCatalog.Infrastructure"
    responsibilities:
      - "Controladores REST / Minimal APIs con mapeo de rutas HTTP"
      - "Middleware centralizado de Problem Details (RFC 7807)"
      - "Contenedor de Inversión de Control (IoC) y composición de servicios"
      - "Exposición de Swagger/OpenAPI"

architectural_invariants:
  strict_dependency_rule:
    description: "El código fuente solo puede depender de capas interiores. Ninguna capa interna sabe nada de capas externas."
    enforcement: "Control físico por dependencias de proyecto .csproj y tests arquitectónicos automáticos con NetArchTest."
  rich_domain_model:
    description: "Prohibición total de setters públicos (anemic domain). Toda mutación de estado ocurre a través de métodos con validación de invariantes."
    enforcement: "Inspección de código y pruebas unitarias exhaustivas en Domain."
  persistence_ignorance:
    description: "Las entidades de dominio no contienen atributos de persistencia ni referencias a EF Core."
    enforcement: "Mapeos relacionales aislados en Infrastructure mediante IEntityTypeConfiguration<T>."
  transactional_integrity:
    description: "Cada comando que modifica estado debe ejecutarse dentro de la unidad de trabajo (Unit of Work) atómica."
    enforcement: "IUnitOfWork.SaveChangesAsync llamado explícitamente en handlers de comandos."
  error_handling_standard:
    description: "Todas las fallas de validación y de dominio se transforman en respuestas estandarizadas RFC 7807."
    enforcement: "Global Exception Handling Middleware en WebApi."

scope_exclusions:
  - "Autenticación y autorización JWT (para aislar la demostración de la arquitectura limpia)"
  - "Paginación dinámica en base de datos (se usa catálogo seed controlado de 10 productos)"
  - "Bus de eventos distribuido asíncrono (RabbitMQ/Kafka); procesamiento 100% síncrono transaccional"
