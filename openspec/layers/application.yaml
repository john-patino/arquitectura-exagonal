# ==============================================================================
# OPENSPEC APPLICATION LAYER SPECIFICATION: USE CASES & ORCHESTRATION
# ==============================================================================
schema: "openspec/v1"
layer:
  name: "Application"
  project: "ProductCatalog.Application"
  namespace: "ProductCatalog.Application"
  level: 1
  allowed_dependencies:
    - "ProductCatalog.Domain"

ports_and_contracts:
  repositories:
    - interface: "IProductRepository"
      namespace: "ProductCatalog.Application.Common.Interfaces"
      methods:
        - name: "GetByIdAsync"
          parameters:
            - name: "id"
              type: "Guid"
            - name: "cancellationToken"
              type: "CancellationToken"
              default: "default"
          returns: "Task<Product?>"
          description: "Recupera la entidad Product por su identificador primario para lectura o mutación."

        - name: "GetBySkuAsync"
          parameters:
            - name: "sku"
              type: "string"
            - name: "cancellationToken"
              type: "CancellationToken"
              default: "default"
          returns: "Task<Product?>"
          description: "Busca un producto por su código SKU para garantizar unicidad."

        - name: "ListAllAsync"
          parameters:
            - name: "cancellationToken"
              type: "CancellationToken"
              default: "default"
          returns: "Task<IReadOnlyList<Product>>"
          description: "Retorna el catálogo completo de productos registrados."

        - name: "AddAsync"
          parameters:
            - name: "product"
              type: "Product"
            - name: "cancellationToken"
              type: "CancellationToken"
              default: "default"
          returns: "Task"
          description: "Registra una nueva entidad en el contexto de persistencia."

        - name: "DeleteAsync"
          parameters:
            - name: "product"
              type: "Product"
            - name: "cancellationToken"
              type: "CancellationToken"
              default: "default"
          returns: "Task"
          description: "Marca una entidad existente para su eliminación física."

  unit_of_work:
    - interface: "IUnitOfWork"
      namespace: "ProductCatalog.Application.Common.Interfaces"
      methods:
        - name: "SaveChangesAsync"
          parameters:
            - name: "cancellationToken"
              type: "CancellationToken"
              default: "default"
          returns: "Task<int>"
          description: "Confirma todas las operaciones atómicas pendientes en la base de datos dentro de una única transacción."

data_transfer_objects:
  - name: "ProductDto"
    type: "record"
    namespace: "ProductCatalog.Application.Products.Dtos"
    properties:
      - name: "Id"
        type: "Guid"
      - name: "Sku"
        type: "string"
      - name: "Name"
        type: "string"
      - name: "Description"
        type: "string?"
      - name: "Price"
        type: "decimal"
      - name: "Stock"
        type: "int"
      - name: "CreatedAtUtc"
        type: "DateTime"
      - name: "UpdatedAtUtc"
        type: "DateTime?"

  - name: "StockSummaryDto"
    type: "record"
    namespace: "ProductCatalog.Application.Products.Dtos"
    properties:
      - name: "ProductId"
        type: "Guid"
      - name: "Sku"
        type: "string"
      - name: "CurrentStock"
        type: "int"
      - name: "UpdatedAtUtc"
        type: "DateTime?"

use_cases:
  # --------------------------------------------------------------------------
  # USE CASE 1: CreateProductCommand
  # --------------------------------------------------------------------------
  - name: "CreateProductCommand"
    type: "Command"
    mediatr_contract: "IRequest<Guid>"
    namespace: "ProductCatalog.Application.Products.Commands.CreateProduct"
    parameters:
      - name: "Sku"
        type: "string"
      - name: "Name"
        type: "string"
      - name: "Description"
        type: "string?"
      - name: "Price"
        type: "decimal"
      - name: "InitialStock"
        type: "int"
    validation_rules:
      validator_class: "CreateProductCommandValidator"
      rules:
        - property: "Sku"
          assertions:
            - "NotEmpty().WithMessage('El SKU es requerido.')"
            - "MaximumLength(50).WithMessage('El SKU no puede exceder 50 caracteres.')"
            - "Matches('^[A-Z0-9-]+$').WithMessage('El SKU solo puede contener caracteres alfanuméricos en mayúsculas y guiones.')"
        - property: "Name"
          assertions:
            - "NotEmpty().WithMessage('El nombre del producto es requerido.')"
            - "MaximumLength(150).WithMessage('El nombre no puede exceder 150 caracteres.')"
        - property: "Price"
          assertions:
            - "GreaterThan(0).WithMessage('El precio debe ser estrictamente mayor a cero.')"
        - property: "InitialStock"
          assertions:
            - "GreaterThanOrEqualTo(0).WithMessage('El stock inicial no puede ser negativo.')"
    handler:
      class: "CreateProductCommandHandler"
      dependencies:
        - "IProductRepository productRepository"
        - "IUnitOfWork unitOfWork"
      execution_flow:
        1: "Consulta si ya existe un producto con el mismo SKU: await _productRepository.GetBySkuAsync(request.Sku, cancellationToken)."
        2: "Si existe, lanza DomainRuleValidationException($'Ya existe un producto registrado con el SKU {request.Sku}.')."
        3: "Invoca la fábrica de dominio: var product = Product.Create(request.Sku, request.Name, request.Description, request.Price, request.InitialStock)."
        4: "Registra en repositorio: await _productRepository.AddAsync(product, cancellationToken)."
        5: "Confirma transacción atómica: await _unitOfWork.SaveChangesAsync(cancellationToken)."
        6: "Retorna el identificador product.Id."

  # --------------------------------------------------------------------------
  # USE CASE 2: ListProductsQuery
  # --------------------------------------------------------------------------
  - name: "ListProductsQuery"
    type: "Query"
    mediatr_contract: "IRequest<IReadOnlyList<ProductDto>>"
    namespace: "ProductCatalog.Application.Products.Queries.ListProducts"
    parameters: []
    handler:
      class: "ListProductsQueryHandler"
      dependencies:
        - "IProductRepository productRepository"
      execution_flow:
        1: "Obtiene las entidades desde el repositorio: var products = await _productRepository.ListAllAsync(cancellationToken)."
        2: "Mapea las entidades de dominio a la colección inmutable ProductDto."
        3: "Retorna la colección ordenada por nombre o SKU."

  # --------------------------------------------------------------------------
  # USE CASE 3: GetProductByIdQuery
  # --------------------------------------------------------------------------
  - name: "GetProductByIdQuery"
    type: "Query"
    mediatr_contract: "IRequest<ProductDto>"
    namespace: "ProductCatalog.Application.Products.Queries.GetProductById"
    parameters:
      - name: "Id"
        type: "Guid"
    validation_rules:
      validator_class: "GetProductByIdQueryValidator"
      rules:
        - property: "Id"
          assertions:
            - "NotEmpty().WithMessage('El identificador del producto es requerido.')"
    handler:
      class: "GetProductByIdQueryHandler"
      dependencies:
        - "IProductRepository productRepository"
      execution_flow:
        1: "Consulta la entidad: var product = await _productRepository.GetByIdAsync(request.Id, cancellationToken)."
        2: "Si product == null, lanza ProductNotFoundException(request.Id)."
        3: "Mapea y retorna el ProductDto correspondiente."

  # --------------------------------------------------------------------------
  # USE CASE 4: UpdateProductStockCommand
  # --------------------------------------------------------------------------
  - name: "UpdateProductStockCommand"
    type: "Command"
    mediatr_contract: "IRequest<StockSummaryDto>"
    namespace: "ProductCatalog.Application.Products.Commands.UpdateProductStock"
    parameters:
      - name: "Id"
        type: "Guid"
      - name: "Delta"
        type: "int"
    validation_rules:
      validator_class: "UpdateProductStockCommandValidator"
      rules:
        - property: "Id"
          assertions:
            - "NotEmpty().WithMessage('El identificador del producto es requerido.')"
        - property: "Delta"
          assertions:
            - "NotEqual(0).WithMessage('El ajuste de stock (Delta) no puede ser cero.')"
    handler:
      class: "UpdateProductStockCommandHandler"
      dependencies:
        - "IProductRepository productRepository"
        - "IUnitOfWork unitOfWork"
      execution_flow:
        1: "Recupera la entidad: var product = await _productRepository.GetByIdAsync(request.Id, cancellationToken)."
        2: "Si product == null, lanza ProductNotFoundException(request.Id)."
        3: "Ejecuta la mutación de dominio encapsulada: product.AdjustStock(request.Delta)."
        4: "Persiste los cambios en la transacción: await _unitOfWork.SaveChangesAsync(cancellationToken)."
        5: "Retorna new StockSummaryDto(product.Id, product.Sku, product.Stock, product.UpdatedAtUtc)."

  # --------------------------------------------------------------------------
  # USE CASE 5: DeleteProductCommand
  # --------------------------------------------------------------------------
  - name: "DeleteProductCommand"
    type: "Command"
    mediatr_contract: "IRequest<Unit>"
    namespace: "ProductCatalog.Application.Products.Commands.DeleteProduct"
    parameters:
      - name: "Id"
        type: "Guid"
    validation_rules:
      validator_class: "DeleteProductCommandValidator"
      rules:
        - property: "Id"
          assertions:
            - "NotEmpty().WithMessage('El identificador del producto es requerido.')"
    handler:
      class: "DeleteProductCommandHandler"
      dependencies:
        - "IProductRepository productRepository"
        - "IUnitOfWork unitOfWork"
      execution_flow:
        1: "Verifica existencia: var product = await _productRepository.GetByIdAsync(request.Id, cancellationToken)."
        2: "Si product == null, lanza ProductNotFoundException(request.Id)."
        3: "Ejecuta eliminación física: await _productRepository.DeleteAsync(product, cancellationToken)."
        4: "Confirma transacción: await _unitOfWork.SaveChangesAsync(cancellationToken)."
        5: "Retorna Unit.Value."

pipeline_behaviors:
  - name: "ValidationBehavior<TRequest, TResponse>"
    interface: "IPipelineBehavior<TRequest, TResponse>"
    namespace: "ProductCatalog.Application.Common.Behaviors"
    execution_order: 1
    description: "Intercepta todas las solicitudes MediatR, recolecta y ejecuta todos los validadores FluentValidation registrados. Si existen fallas, lanza ValidationException con los detalles agrupados antes de alcanzar el handler."
