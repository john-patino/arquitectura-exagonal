# ==============================================================================
# OPENSPEC INFRASTRUCTURE LAYER SPECIFICATION: PERSISTENCE & ADAPTERS
# ==============================================================================
schema: "openspec/v1"
layer:
  name: "Infrastructure"
  project: "ProductCatalog.Infrastructure"
  namespace: "ProductCatalog.Infrastructure"
  level: 2
  allowed_dependencies:
    - "ProductCatalog.Domain"
    - "ProductCatalog.Application"

orm_configuration:
  provider: "Npgsql.EntityFrameworkCore.PostgreSQL"
  context_class: "CleanDbContext"
  namespace: "ProductCatalog.Infrastructure.Persistence"
  connection_string_key: "ConnectionStrings:Database"

entity_configurations:
  - entity: "Product"
    configuration_class: "ProductConfiguration"
    implements: "IEntityTypeConfiguration<Product>"
    table_name: "products"
    schema: "public"
    properties:
      - property: "Id"
        column: "id"
        type: "uuid"
        is_primary_key: true
        value_generated: "never"

      - property: "Sku"
        column: "sku"
        type: "varchar(50)"
        is_required: true
        index:
          name: "ix_products_sku"
          is_unique: true

      - property: "Name"
        column: "name"
        type: "varchar(150)"
        is_required: true

      - property: "Description"
        column: "description"
        type: "varchar(1000)"
        is_required: false

      - property: "Price"
        column: "price"
        type: "numeric(12,2)"
        is_required: true

      - property: "Stock"
        column: "stock"
        type: "integer"
        is_required: true

      - property: "CreatedAtUtc"
        column: "created_at_utc"
        type: "timestamp with time zone"
        is_required: true

      - property: "UpdatedAtUtc"
        column: "updated_at_utc"
        type: "timestamp with time zone"
        is_required: false

    encapsulation_mapping:
      access_mode: "Property"
      notes: "EF Core accede a las propiedades con private setters mapeando directamente al estado de la entidad."

adapters_implementation:
  - repository: "ProductRepository"
    implements: "IProductRepository"
    namespace: "ProductCatalog.Infrastructure.Persistence.Repositories"
    injected_dependencies:
      - "CleanDbContext _context"
    implementation_details:
      GetByIdAsync: "_context.Products.FirstOrDefaultAsync(p => p.Id == id, cancellationToken)"
      GetBySkuAsync: "_context.Products.FirstOrDefaultAsync(p => p.Sku == sku, cancellationToken)"
      ListAllAsync: "_context.Products.AsNoTracking().OrderBy(p => p.Name).ToListAsync(cancellationToken)"
      AddAsync: "_context.Products.AddAsync(product, cancellationToken).AsTask()"
      DeleteAsync: "_context.Products.Remove(product); Task.CompletedTask"

  - unit_of_work: "UnitOfWork"
    implements: "IUnitOfWork"
    namespace: "ProductCatalog.Infrastructure.Persistence"
    injected_dependencies:
      - "CleanDbContext _context"
    implementation_details:
      SaveChangesAsync: "_context.SaveChangesAsync(cancellationToken)"

