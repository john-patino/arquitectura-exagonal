# ==============================================================================
# OPENSPEC PRESENTATION LAYER SPECIFICATION: WEB API & HTTP INTERFACES
# ==============================================================================
schema: "openspec/v1"
layer:
  name: "WebApi"
  project: "ProductCatalog.WebApi"
  namespace: "ProductCatalog.WebApi"
  level: 2
  allowed_dependencies:
    - "ProductCatalog.Domain"
    - "ProductCatalog.Application"
    - "ProductCatalog.Infrastructure"

host_configuration:
  framework: "ASP.NET Core .NET 8"
  server_url: "http://0.0.0.0:5000"
  cors:
    policy_name: "AllowLocalClient"
    allowed_origins:
      - "http://localhost:5173"
    allowed_methods:
      - "GET"
      - "POST"
      - "PATCH"
      - "DELETE"
      - "OPTIONS"
    allowed_headers:
      - "*"

openapi_swagger:
  enabled: true
  title: "Plataforma de Catálogo e Inventario - Clean Architecture API"
  version: "v1"
  endpoint_route: "/swagger/v1/swagger.json"
  ui_route: "/swagger"

http_endpoints:
  base_path: "/api/v1/products"
  controller: "ProductsController"
  namespace: "ProductCatalog.WebApi.Controllers"

  routes:
    # ------------------------------------------------------------------------
    # 1. POST /api/v1/products
    # ------------------------------------------------------------------------
    - path: ""
      method: "POST"
      summary: "Registra un nuevo producto en el catálogo e inicializa su inventario."
      request_body:
        content_type: "application/json"
        schema:
          type: "object"
          properties:
            sku: { type: "string", example: "MON-SAMS-ODYSSEY" }
            name: { type: "string", example: "Samsung Odyssey G9 49\"" }
            description: { type: "string", example: "Monitor Gaming Curvo 240Hz 1ms Dual QHD" }
            price: { type: "number", format: "decimal", example: 1299.99 }
            initialStock: { type: "integer", example: 10 }
          required: ["sku", "name", "price", "initialStock"]
      dispatched_command: "CreateProductCommand"
      responses:
        - status_code: 201
          description: "Producto creado exitosamente."
          headers:
            Location: "/api/v1/products/{id}"
          body_schema:
            type: "object"
            properties:
              id: { type: "string", format: "uuid" }
        - status_code: 400
          description: "Validación fallida de datos o violación de unicidad de SKU."
          body_schema: "$ref: '#/components/schemas/ProblemDetails'"

    # ------------------------------------------------------------------------
    # 2. GET /api/v1/products
    # ------------------------------------------------------------------------
    - path: ""
      method: "GET"
      summary: "Retorna el catálogo completo de productos con su stock actual."
      dispatched_query: "ListProductsQuery"
      responses:
        - status_code: 200
          description: "Lista de productos obtenida exitosamente."
          body_schema:
            type: "array"
            items: "$ref: '#/components/schemas/ProductDto'"

    # ------------------------------------------------------------------------
    # 3. GET /api/v1/products/{id}
    # ------------------------------------------------------------------------
    - path: "/{id:guid}"
      method: "GET"
      summary: "Obtiene el detalle completo de un producto por su GUID."
      route_parameters:
        - name: "id"
          type: "Guid"
          required: true
      dispatched_query: "GetProductByIdQuery(id)"
      responses:
        - status_code: 200
          description: "Detalle del producto retornado."
          body_schema: "$ref: '#/components/schemas/ProductDto'"
        - status_code: 404
          description: "El producto solicitado no existe."
          body_schema: "$ref: '#/components/schemas/ProblemDetails'"

    # ------------------------------------------------------------------------
    # 4. PATCH /api/v1/products/{id}/stock
    # ------------------------------------------------------------------------
    - path: "/{id:guid}/stock"
      method: "PATCH"
      summary: "Ajusta el stock físico de un producto mediante un incremento o decremento (Delta)."
      route_parameters:
        - name: "id"
          type: "Guid"
          required: true
      request_body:
        content_type: "application/json"
        schema:
          type: "object"
          properties:
            delta: { type: "integer", example: -2 }
          required: ["delta"]
      dispatched_command: "UpdateProductStockCommand(id, delta)"
      responses:
        - status_code: 200
          description: "Ajuste de inventario aplicado exitosamente."
          body_schema: "$ref: '#/components/schemas/StockSummaryDto'"
        - status_code: 400
          description: "Violación de regla de dominio (stock resultante negativo) o delta cero."
          body_schema: "$ref: '#/components/schemas/ProblemDetails'"
        - status_code: 404
          description: "Producto no encontrado."
          body_schema: "$ref: '#/components/schemas/ProblemDetails'"

    # ------------------------------------------------------------------------
    # 5. DELETE /api/v1/products/{id}
    # ------------------------------------------------------------------------
    - path: "/{id:guid}"
      method: "DELETE"
      summary: "Elimina físicamente un producto del catálogo."
      route_parameters:
        - name: "id"
          type: "Guid"
          required: true
      dispatched_command: "DeleteProductCommand(id)"
      responses:
        - status_code: 204
          description: "Producto eliminado satisfactoriamente. Sin contenido retornado."
        - status_code: 404
          description: "El producto no existe."
          body_schema: "$ref: '#/components/schemas/ProblemDetails'"

exception_handling_middleware:
  class: "GlobalExceptionHandlerMiddleware"
  namespace: "ProductCatalog.WebApi.Middleware"
  rfc_standard: "RFC 7807 (Problem Details for HTTP APIs)"
  mappings:
    - exception: "DomainRuleValidationException"
      status_code: 400
      type: "https://tools.ietf.org/html/rfc7231#section-6.5.1"
      title: "Violación de Regla de Negocio"
      detail_source: "exception.Message"

    - exception: "ProductNotFoundException"
      status_code: 404
      type: "https://tools.ietf.org/html/rfc7231#section-6.5.4"
      title: "Recurso No Encontrado"
      detail_source: "exception.Message"

    - exception: "ValidationException (FluentValidation)"
      status_code: 400
      type: "https://tools.ietf.org/html/rfc7231#section-6.5.1"
      title: "Error de Validación de Parámetros"
      detail_source: "Consolidación de fallos de validación por propiedad"
      extensions:
        errors: "Dictionary<string, string[]> agrupado por campo"

    - exception: "Exception (Cualquier error inesperado)"
      status_code: 500
      type: "https://tools.ietf.org/html/rfc7231#section-6.6.1"
      title: "Error Interno del Servidor"
      detail_source: "'Ocurrió un error inesperado al procesar la solicitud.'"
