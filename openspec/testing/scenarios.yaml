# ==============================================================================
# OPENSPEC TESTING SPECIFICATION: EXECUTABLE SCENARIOS & TEST SUITES
# ==============================================================================
schema: "openspec/v1"
testing_pyramid:
  philosophy: "Verificación de invariantes en el núcleo más rápido (Domain), aislamiento de orquestación con Mocks (Application), y pruebas de integración sobre base de datos real efímera (Infrastructure con Testcontainers)."

test_suites:
  # ============================================================================
  # 1. PRUEBAS UNITARIAS DE DOMINIO (Domain.Tests)
  # ============================================================================
  - project: "ProductCatalog.Domain.Tests"
    layer: "Domain"
    type: "Unit"
    execution_time: "< 50ms"
    dependencies:
      - "ProductCatalog.Domain"
      - "xunit"
      - "FluentAssertions"

    scenarios:
      - id: "DOM-001"
        name: "Product_AdjustStock_ShouldIncreaseStock_WhenDeltaIsPositive"
        category: "State Mutation"
        given: "Un producto creado con stock inicial de 10 unidades."
        when: "Se ejecuta product.AdjustStock(5)."
        then:
          - "El stock resultante debe ser exactamente 15."
          - "El atributo UpdatedAtUtc no debe ser nulo y debe coincidir con el instante actual."

      - id: "DOM-002"
        name: "Product_AdjustStock_ShouldDecreaseStock_WhenDeltaIsNegativeAndSufficientStock"
        category: "State Mutation"
        given: "Un producto creado con stock inicial de 10 unidades."
        when: "Se ejecuta product.AdjustStock(-4)."
        then:
          - "El stock resultante debe ser exactamente 6."
          - "El atributo UpdatedAtUtc debe actualizarse."

      - id: "DOM-003"
        name: "Product_AdjustStock_ShouldThrowDomainRuleValidationException_WhenResultingStockIsNegative"
        category: "Business Invariant Enforcement"
        given: "Un producto creado con stock inicial de 5 unidades."
        when: "Se intenta ejecutar product.AdjustStock(-6)."
        then:
          - "Debe lanzar inmediatamente una excepción DomainRuleValidationException."
          - "El mensaje de error debe indicar que el stock no puede ser negativo."
          - "El stock de la entidad debe mantenerse intacto en 5 (inmutabilidad ante fallo)."

      - id: "DOM-004"
        name: "Product_Create_ShouldThrowDomainRuleValidationException_WhenPriceIsZeroOrNegative"
        category: "Factory Invariant Enforcement"
        given: "Valores válidos para SKU, nombre y stock inicial."
        when: "Se invoca Product.Create con precio 0.00m o -15.50m."
        then:
          - "Debe lanzar DomainRuleValidationException con mensaje descriptivo sobre el precio."

      - id: "DOM-005"
        name: "Product_Create_ShouldThrowDomainRuleValidationException_WhenInitialStockIsNegative"
        category: "Factory Invariant Enforcement"
        given: "Valores válidos para SKU, nombre y precio."
        when: "Se invoca Product.Create con stock inicial -1."
        then:
          - "Debe lanzar DomainRuleValidationException indicando que el stock inicial no puede ser negativo."

  # ============================================================================
  # 2. PRUEBAS UNITARIAS DE APLICACIÓN (Application.Tests)
  # ============================================================================
  - project: "ProductCatalog.Application.Tests"
    layer: "Application"
    type: "Unit"
    execution_time: "< 200ms"
    dependencies:
      - "ProductCatalog.Application"
      - "ProductCatalog.Domain"
      - "NSubstitute"
      - "FluentValidation"
      - "FluentAssertions"

    scenarios:
      - id: "APP-001"
        name: "CreateProductCommandHandler_ShouldPersistProduct_WhenValidationPassesAndSkuIsUnique"
        category: "Use Case Execution"
        given: "Mock de IProductRepository donde GetBySkuAsync retorna null (SKU libre) y mock de IUnitOfWork."
        when: "Se envía CreateProductCommand con SKU='NEW-SKU-01', Name='Producto Test', Price=100m, InitialStock=10."
        then:
          - "Debe llamar a productRepository.AddAsync con la entidad Product generada."
          - "Debe llamar a unitOfWork.SaveChangesAsync una sola vez."
          - "Debe retornar un Guid no vacío correspondiente al nuevo producto."

      - id: "APP-002"
        name: "CreateProductCommandHandler_ShouldThrowDomainRuleValidationException_WhenSkuAlreadyExists"
        category: "Business Invariant Enforcement"
        given: "Mock de IProductRepository donde GetBySkuAsync('DUPLICATE-SKU') retorna un producto existente."
        when: "Se ejecuta CreateProductCommand con dicho SKU duplicado."
        then:
          - "Debe lanzar DomainRuleValidationException."
          - "No debe llamar a productRepository.AddAsync."
          - "No debe llamar a unitOfWork.SaveChangesAsync."

      - id: "APP-003"
        name: "UpdateProductStockCommandHandler_ShouldCallAdjustStockAndCommit_WhenProductExists"
        category: "Use Case Execution"
        given: "Un producto existente con stock=20 retornado por productRepository.GetByIdAsync(id)."
        when: "Se envía UpdateProductStockCommand(id, Delta: -5)."
        then:
          - "El stock de la entidad debe actualizarse a 15."
          - "Debe llamar a unitOfWork.SaveChangesAsync(cancellationToken)."
          - "Debe retornar un StockSummaryDto con CurrentStock=15."

      - id: "APP-004"
        name: "GetProductByIdQueryHandler_ShouldThrowProductNotFoundException_WhenProductDoesNotExist"
        category: "Exception Handling"
        given: "Mock de IProductRepository donde GetByIdAsync retorna null."
        when: "Se ejecuta GetProductByIdQuery(nonExistentGuid)."
        then:
          - "Debe arrojar ProductNotFoundException con el Guid especificado."

      - id: "APP-005"
        name: "ValidationBehavior_ShouldThrowValidationException_WhenCommandHasInvalidData"
        category: "Pipeline Validation Behavior"
        given: "Un CreateProductCommand con SKU en minúsculas, precio negativo y nombre vacío."
        when: "La petición atraviesa el ValidationBehavior."
        then:
          - "Debe arrojar FluentValidation.ValidationException sin alcanzar el handler."
          - "El error debe contener mensajes para Sku, Price y Name."

  # ============================================================================
  # 3. PRUEBAS DE INTEGRACIÓN DE INFRAESTRUCTURA (Infrastructure.Tests)
  # ============================================================================
  - project: "ProductCatalog.Infrastructure.Tests"
    layer: "Infrastructure"
    type: "Integration"
    execution_time: "< 5s"
    dependencies:
      - "ProductCatalog.Infrastructure"
      - "ProductCatalog.Domain"
      - "Testcontainers.PostgreSql"
      - "Microsoft.EntityFrameworkCore"
      - "FluentAssertions"

    scenarios:
      - id: "INFRA-001"
        name: "ProductRepository_ShouldPersistAndRetrieveProduct_AgainstRealPostgresInstance"
        category: "Real Database Persistence"
        given: "Un contenedor de PostgreSQL 16 levantado con Testcontainers y CleanDbContext migrado."
        when: "Se persiste una nueva entidad Product usando ProductRepository.AddAsync y UnitOfWork.SaveChangesAsync."
        then:
          - "Una nueva consulta GetByIdAsync en una instancia separada de DbContext debe recuperar la entidad con todos sus campos idénticos."
          - "El mapeo de private setters debe preservar exactamente los valores de Id, Sku, Stock y Timestamps."

      - id: "INFRA-002"
        name: "ProductRepository_ShouldEnforceSkuUniqueConstraint_AtDatabaseLevel"
        category: "Relational Constraint Integrity"
        given: "Un producto con SKU='UNIQUE-SKU-99' ya guardado en la base de datos PostgreSQL."
        when: "Se intenta persistir un segundo producto con el mismo SKU='UNIQUE-SKU-99'."
        then:
          - "EF Core y PostgreSQL deben arrojar DbUpdateException con violación del índice único 'ix_products_sku'."

      - id: "INFRA-003"
        name: "SeedData_ShouldInitializeTenSampleProducts_OnFreshDatabase"
        category: "Database Seeding Verification"
        given: "Una base de datos inicializada por primera vez."
        when: "Se ejecuta la inicialización del contexto."
        then:
          - "La tabla 'products' debe contener exactamente 10 registros."
          - "Ningún producto seed debe poseer stock negativo ni precio menor o igual a cero."
